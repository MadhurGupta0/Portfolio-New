<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MetricStrip</title>
<style>
  .demo { padding: var(--space-6); }
  .demo--stack { display: grid; gap: var(--space-8); }
  .demo__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .demo__row--wide { gap: var(--space-8); }
  .demo__plate { min-height: 0; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../preview.js"></script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../bundle.js?v=2"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var M = window.MG, h = React.createElement;
  var el = h('div', { className: 'demo' },
    h(M.MetricStrip, { metrics: [
      { value: '101', label: 'HTTP routes' },
      { value: '~19.9k', label: 'lines of Go' },
      { value: '2', label: 'external dependencies' },
      { value: 'EIP-712', label: 'signed settlement' }
    ] }));
  ReactDOM.createRoot(document.getElementById('root')).render(el);
})();
</script>
</body>
</html>
