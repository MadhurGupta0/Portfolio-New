<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TitleBlock</title>
<style>
  .demo { padding: var(--space-6); }
  .demo--stack { display: grid; gap: var(--space-8); }
  .demo__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  .demo__row--wide { gap: var(--space-8); }
  .demo__plate { min-height: 0; }
  .demo__grow { flex: 1; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../preview.js"></script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../bundle.js?v=2"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var M = window.MG, h = React.createElement;
  var el = h('div', { className: 'demo demo--stack' },
    h(M.TitleBlock, { facts: [
      { label: 'Role', value: 'Core full-stack engineer' },
      { label: 'Year', value: '2025–2026' },
      { label: 'Status', value: h(M.StatusMark, { status: 'live' }) },
      { label: 'Links', wide: true, value: [h(M.TextLink, { key: 'a', href: 'https://www.selfmind.app' }, 'selfmind.app'), h(M.TextLink, { key: 'b', href: 'https://mello-mind-journey.vercel.app' }, 'Web app')] }
    ] }),
    h(M.Field, { variant: 'plate', className: 'demo__plate' },
      h(M.TitleBlock, { className: 'demo__grow', facts: [
        { label: 'Role', value: 'AI and full-stack developer' },
        { label: 'Based in', value: 'Noida, India' },
        { label: 'Email', wide: true, value: h(M.TextLink, { href: 'mailto:guptamadhur03@gmail.com' }, 'guptamadhur03@gmail.com') }
      ] })));
  ReactDOM.createRoot(document.getElementById('root')).render(el);
})();
</script>
</body>
</html>
