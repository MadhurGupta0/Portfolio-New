    h(M.ExperienceItem, { slot: true, period: 'Year–year', role: 'Your role', org: 'Company, city or remote',
      summary: 'One sentence on what you owned there.',
      points: ['An outcome, with the number or fact that proves it.', 'A second outcome. Two or three is enough.'] }));
